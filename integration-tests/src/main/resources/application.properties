# Native smoke-test app (task 6.1). The default cache backend is NATS KV, so every cache name
# referenced below resolves to the extension under test rather than silently falling back to Caffeine.
quarkus.cache.type=nats

# Give the "smoke" cache an explicit bucket so the native run never collides with a derived-default
# bucket that another cache in a different app might have claimed on the shared dev-service server.
quarkus.nats-cache.caches.smoke.bucket=NATIVE_SMOKE
