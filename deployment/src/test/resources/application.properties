# Integration tests (section 5): use the NATS KV backend with zero broker configuration —
# the quarkiverse nats-jetstream dev service starts a NATS server automatically.
quarkus.cache.type=nats

# Mixed-backend test (5.4): one cache is overridden to the Caffeine backend while the
# global default stays "nats". Proves both CacheManagerInfoBuildItems coexist in one app.
# NOTE: per-name override property is quarkus.cache.<name>.type (smallrye @WithParentName map),
# NOT quarkus.cache.caches.<name>.type — verified against smallrye-config 3.17.2.
quarkus.cache.mixedcaffeine.type=caffeine

# Explicit-bucket test: cache "explicit" is deliberately backed by bucket EXPLICIT_BKT
# (its derived default would be EXPLICIT). Exercises quarkus.nats-cache.caches.<name>.bucket end-to-end.
quarkus.nats-cache.caches.explicit.bucket=EXPLICIT_BKT

# TTL-on-creation test: cache "ttlcheck" must have its (auto-created) bucket carry this bucket-level TTL.
quarkus.nats-cache.caches.ttlcheck.ttl=2h
